cluster_system: |-
  You are designing NEW heuristics for 2D Euclidean TSP-${problem_size} to
      complement an existing frozen pool. You will see a sample of PORTFOLIO
      FAULT cases — decision steps where NONE of the existing heuristics' argmax
      matches the teacher's argmax.

      ${context}

      The user message lists the existing pool (DO NOT propose strategies similar to any of these)
      and then contains TWO sections:
        1. AGGREGATE STATS: distribution (mean + percentiles) over the sampled
           portfolio-fault cases. Use
           these to decide which feature axes are actually discriminative —
           e.g. if step_norm p50 is 0.18 and p90 is 0.81, "early-tour" is a
           meaningful axis; if a feature is uniform, it's a weak axis.
        2. INDIVIDUAL CASES: the sampled fault cases ("Case 1", "Case 2", ...) with detailed
           per-case features, for grounding your strategies in concrete examples.

      Each individual fault case is described with these compact features:
        step    = tour-progress fraction (0=start, 1=end)
        n_unv   = number of unvisited cities remaining
        cur     = current city's (x,y)
        teacher = (x,y) of the city the teacher picked at top-1
        d_t     = Euclidean distance from cur to teacher's pick
        d_near  = distance from cur to the NEAREST unvisited city
        ratio   = d_t / d_near (ratio > 1 means teacher skipped the nearest)
        fwd_dot = cosine of angle between (cur - first_node) and
                  (teacher - cur). +1 = teacher continues forward direction,
                  -1 = teacher doubles back toward the start.
        teacher = on_hull / interior — whether teacher's pick is on the
                  instance's convex hull.
        d_to_start = distance from teacher's pick back to the tour start city.
        frozen_pick = the city the frozen pool picked (consensus = all frozen
                      heuristics agreed; split = they disagreed).

      TASK:
      Use the aggregate stats to choose which axes to slice along; use the
      individual cases to ground your strategies. Identify any distinct
      failure patterns you see.
      Propose UP TO ${n_modes} new heuristic strategies — fewer is fine,
      and strongly preferred if you only see 1-3 real patterns. Do NOT invent
      extra buckets just to fill the quota; weak/contrived buckets hurt more
      than they help.

      Specialist strategies are valued: each strategy only needs to handle a
      SUBSET of the cases below — it does not need to cover most of them. A
      narrow rule that decisively solves one specific failure mode is more
      useful than a broad rule that touches many cases weakly.

      BUT the strategies COLLECTIVELY should cover as many cases as possible.
      That means each new strategy should target a DIFFERENT subset of cases —
      avoid producing two strategies whose case_indices overlap heavily, and
      avoid producing a strategy whose target subset is already well-handled
      by another bucket you proposed. Think of the buckets as a partition:
      different signatures, different cases, maximum total coverage.

      Guidelines:
      - Use whichever signals are actually discriminative — tour-progress
        phase, geometric configuration, frozen-pool consensus, or any
        combination. A pure temporal split is allowed if the examples
        support it.
      - Strategies must be structurally different from each other AND from
        the existing pool. Prefer global tour-structure reasoning (convex
        hull, cheapest-insertion, savings, MST ordering, regret of
        postponement) over yet another nearest-neighbor variant.
      - Each strategy must be expressible as a SINGLE vectorized scoring
        rule (no Python loops, no sorting passes). Only the argmax matters;
        tail shape is irrelevant.
      - It is OK to leave some cases uncovered. A new heuristic only needs
        to be RIGHT on the subset it claims, not on everything.

      OUTPUT FORMAT: a JSON list and nothing else (no markdown, no prose), one object per bucket:

      [
        {"mode_name": "<a few words naming the failure pattern>",
         "signature": "<one sentence: the failure pattern shared by these cases>",
         "case_indices": [<case numbers in this bucket — small subsets are fine>],
         "strategy": "<1-3 self-contained sentences: the failure pattern it targets and a vectorized
                      scoring rule whose argmax would land on the teacher's pick for cases in this bucket>"},
        ...
      ]

      (stop after as many buckets as you genuinely see; max ${n_modes})

