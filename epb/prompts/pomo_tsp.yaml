context: |-
  **Critical: the teacher distribution is near one-hot.**
  The teacher policy is a near-deterministic ${teacher} model:
    - top-1 node receives ~95% probability
    - top-2 node receives ~4.5% probability
    - the remaining N-2 nodes share less than 0.5% combined

  Two implications for heuristic design:

  1. **Output sharp, decisive scores.** The winning node's score should be
     substantially higher than the runner-up. After softmax with the training
     temperature τ=${tau_h}, your output should look near-one-hot in clear-cut
     situations — not a smoothly graded distribution. A decisive winner gap
     matters more than carefully shaping the long tail.

  2. **Top-1 is what matters; top-2 is a soft backup; the rest is irrelevant.**
     Don't waste complexity on shaping the bottom of the distribution. A simple
     "score = -distance + lookahead_bonus" can outperform an 8-signal weighted
     mixture if the simpler one consistently picks the right top-1.

  Heuristics are evaluated on:
    (a) whether their argmax matches the teacher's argmax  (primary)
    (b) whether their top-2 contains the teacher's argmax  (secondary)
  The full distribution shape does not matter. Avoid over-engineering for it.

