seeds:
  - "nearest-feasible-with-forced-depot: closest feasible customer wins; depot vote spikes only when no customer is feasible"
  - "snug-fit-with-low-load-depot: feasible customer whose demand fills the largest fraction of remaining load; depot vote rises smoothly as load drops below ~0.2"
  - "load-conditional-distance: when load is high prefer FAR customers (push outward); low load prefer NEAR customers; depot vote scales with (1-load)"
  - "savings-style-with-arm-pivot: rank by Clarke-Wright savings; depot vote rises when remaining unvisited cluster is closer to depot than to current (arm done, pivot)"
  - "depot-anchor-with-radial-recall: penalise drifting far from depot when load is low; vote depot when ddepot < dcur AND load < 0.5"
  - "cluster-density-with-cleanup-depot: prefer customers in dense regions; depot vote rises when only sparse outliers remain"
  - "first-arc-coherence: prefer customers whose angle-from-depot continues the first-customer arc; depot vote when angle bimodality is strong (need arm switch)"
  - "high-demand-when-full-low-when-empty: load-modulated demand preference; depot vote when no demand fits cleanly"
  - "frontier-priority-then-loop-back: outer (high-radius) customers early; depot vote when only near-depot customers remain"
  - "line-of-sight-to-depot: customers on the line current→depot get bonus; depot vote when current is heading depot-ward and load < 0.4"
  - "demand-fit-vs-distance: blend distance penalty with demand-fits-load bonus, sharpened; depot vote inversely with capacity slack"
  - "bimodal-pivot: when angular bimodality is strong, score depot HIGH (let router refill + switch arms) rather than chasing stragglers"

implement_system: |-
  You write Python heuristic modules for a 2D CVRP with ${problem_size} customers.
  At each step you score K unvisited customers AND the depot decision.

  Function signature (must match exactly):
    heuristic(unselected_locs, unselected_demand, current_loc, depot_loc,
              load, feasibility_mask) -> torch.Tensor [B, K+1]

  Args:
    unselected_locs:    [B, K, 2]  customer xy in [0,1]^2
    unselected_demand:  [B, K]     customer demand (each ≤ 1.0)
    current_loc:        [B, 2]     current vehicle position
    depot_loc:          [B, 2]     depot position
    load:               [B]        remaining capacity in [0, 1]
    feasibility_mask:   [B, K]     bool, True iff demand ≤ load

  ${context}

  Rules:
    - Imports allowed: torch, torch.nn.functional as F, math.  Nothing else.
    - All ops batched.  K is variable; never hard-code it.
    - Output shape MUST be [B, K+1].
        * customer positions [0..K-1]: infeasible MUST be float("-inf").
        * depot position K (last):     MUST be finite (depot is always a valid action).
    - No Python `for`/`while` loops over B or K.  No side effects.
    - Concatenate using `torch.cat([cust_logits, depot_logit.unsqueeze(-1)], dim=-1)`.

  Return only the complete Python module, no explanation, no markdown fences.

