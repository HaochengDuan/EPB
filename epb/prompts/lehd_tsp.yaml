budget:
  block: |-
    PROGRAM COMPLEXITY BUDGET (hard rules, checked automatically; a violation is rejected like a crash):
      - The raw inputs (${raw_inputs}) may ONLY be passed
        to the primitives below. Never index, slice or compute on them directly. No torch.cdist,
        topk, sort, gather, matmul; no loops, comprehensions, helper functions or classes.
      - Use at most ${max_concepts} DISTINCT primitive(s) (each is one concept). Combine their [B,K] outputs
        with plain arithmetic and elementwise torch ops (exp, log, clamp, sigmoid, minimum, maximum,
        where). The code must work for any number of candidates K. At most ${max_branches} branch(es) (if / torch.where / masked_fill). At most ${max_lines} statement
        lines inside the function.
      - Start the module with `import torch` and `from ${feats_module} import feat`.
      Primitives (all batched, return [B,K] floats):
    ${primitives}
      One program = ONE clear idea expressed with ${max_concepts} concept(s), e.g. "nearest neighbour, but
      prefer isolated cities": logits = -feat.dist_cur(unselected_locs, current_loc) + 2.0 * feat.nn_dist(unselected_locs).
  code_constraint: |-
    PROGRAM BUDGET: raw inputs only inside feat.* primitives; at most ${max_concepts} distinct primitives, ${max_branches} branches, ${max_lines} statement lines. Violations are rejected.
  tg_reject: |-
    The previous rewrite was REJECTED by the program-complexity gate: ${reason}. The rewrite must stay within the budget (raw inputs only inside feat.* primitives; at most the allowed number of distinct primitives, branches and statement lines).
  fallback: |-
    import torch
    from ${feats_module} import feat

    def heuristic(unselected_locs, first_loc, current_loc):
        return -feat.dist_cur(unselected_locs, current_loc)
  template:
    tiny: |-
      import torch
      from ${feats_module} import feat

      def heuristic(unselected_locs, first_loc, current_loc):
          # Uses 1 concept(s): dist_cur
          d_cur = feat.dist_cur(unselected_locs, current_loc)


          logits = -d_cur
          return logits
    simple: |-
      import torch
      from ${feats_module} import feat

      def heuristic(unselected_locs, first_loc, current_loc):
          # Uses 2 concept(s): dist_cur, dist_start
          d_cur = feat.dist_cur(unselected_locs, current_loc)
          d_start = feat.dist_start(unselected_locs, first_loc)

          logits = -d_cur - 0.5 * d_start
          return logits
    medium: |-
      import torch
      from ${feats_module} import feat

      def heuristic(unselected_locs, first_loc, current_loc):
          # Uses 2 concept(s): dist_cur, dist_start
          d_cur = feat.dist_cur(unselected_locs, current_loc)
          d_start = feat.dist_start(unselected_locs, first_loc)
          k = feat.n_unvisited(unselected_locs)
          logits = -d_cur - 0.5 * d_start
          return logits
  seeds:
    tiny:
      - "nearest-neighbour: score candidates by closeness to the current city (dist_cur)"
      - "isolation-first: prefer candidates that are far from every other candidate (nn_dist)"
      - "density: prefer candidates that have many other candidates nearby (density)"
      - "homeward: prefer candidates that lie in the direction of the start city (homeward_cos)"
      - "outward sweep: prefer candidates on the outskirts of the remaining set (outward)"
      - "closing: prefer candidates close to the tour's starting city (dist_start)"
    simple: &seeds_two
      - "nearest-neighbour: score candidates by closeness to the current city (dist_cur)"
      - "isolation-first: prefer candidates that are far from every other candidate (nn_dist)"
      - "density: prefer candidates that have many other candidates nearby (density)"
      - "homeward: prefer candidates that lie in the direction of the start city (homeward_cos)"
      - "outward sweep: prefer candidates on the outskirts of the remaining set (outward)"
      - "closing: prefer candidates close to the tour's starting city (dist_start)"
      - "closing-aware nearest neighbour: dist_cur while many candidates remain, dist_start when few (dist_cur + n_unvisited or dist_start)"
      - "lookahead regret: nearest neighbour with a bonus for isolated candidates (dist_cur + nn_dist)"
      - "away-from-home sweep: nearest neighbour that avoids heading back too early (dist_cur + homeward_cos)"
      - "cluster-first: nearest neighbour that favours dense areas (dist_cur + density)"
      - "boundary sweep: nearest neighbour that favours the outskirts (dist_cur + outward)"
      - "endgame: return toward the start city when few candidates remain (dist_start + n_unvisited)"
    medium: *seeds_two
