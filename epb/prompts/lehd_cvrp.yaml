context: |-
  **${teacher} setting (variable K, you DO score depot):**
    - You see the unvisited customer subgraph (K customers).  K varies (1..N-1).
    - Vehicle capacity is 1.0 (normalised).  load[b] ∈ [0, 1] is what's left now.
    - feasibility_mask[b, k] = True iff demand[b, k] ≤ load[b].
    - Output shape is [B, K+1]:
        * positions [0..K-1]: per-customer logits (infeasible MUST be -inf).
          Position k MUST correspond to the customer at unselected_locs[b, k] —
          do NOT sort, permute, or reorder.
        * position K (last):  the depot logit — vote for "return to depot now".
    - The router mixes your output with other heuristics' outputs over a unified
      [N+1] action space (depot + N customers); your depot logit competes with
      other heuristics' depot logits.  Boost it when load is low, when the route
      arm is exhausted, when no customer fits cleanly, etc.
    - **At-depot edge case is handled by the framework**: when current_loc equals
      depot_loc (vehicle just returned to depot), the framework forces your depot
      logit to -inf before the softmax (depot can't be selected from depot).  You
      don't need to detect this case yourself — output any depot logit you like,
      it will be overridden in those rows.

  **Teacher distribution is moderately peaked, NOT one-hot.** The ${teacher}
  greedy teacher is genuinely uncertain on many steps — especially early in a
  route when many customers are still unvisited (K large):
      - top-1 of [customers, depot] typically gets ~0.70-0.82 probability
        (and only ~0.65 on the hard, ambiguous steps where heuristics fail)
      - top-2 gets ~0.10, top-3 ~0.05; a real tail carries the rest
      - it sharpens toward one-hot only LATE in a route (K small) when the
        remaining choice is essentially forced
    Two implications for heuristic design:
      (i) MATCH the teacher's confidence, do NOT exceed it.  After softmax with
          τ=${tau_h} your output should be moderately peaked, NOT near-one-hot.
          Over-sharp scores (≈99% on one node) get punished hard on the many
          steps where the teacher only commits ~70%: they inflate KL and FLIP
          top-1 on exactly the ambiguous states that decide the result.
      (ii) Capture the teacher's MASS, not just its argmax.  Getting top-1 right
           WHILE keeping the teacher's top-2/top-3 alive (real probability, not
           crushed to ~0) is what lowers KL.  A scorer that ranks the right few
           candidates near the top beats one that bets everything on one pick.
    Heuristics are evaluated on:
      (a) KL to the full teacher distribution  (primary)
      (b) whether their argmax matches the teacher's argmax  (secondary)
    Do NOT collapse the output to one-hot — that is the #1 failure mode here.

  **Reason over GEOMETRY, not over node ids.** Candidates have no stable
  identifier — your code receives a [B, K, 2] block of customer xy and an [B, K]
  block of demand, and any local index k is meaningful only relative to *this*
  batch row.  When diagnosing failures or designing strategies, talk in terms of:
      - positions (xy in [0,1]^2)
      - demands and remaining load
      - polar coords from depot (θ, r) — exposes route arms / arm bimodality
      - distance to current (dcur), distance to depot (ddepot)
      - Clarke-Wright savings = ddepot_self + ddepot_cur − dcur
    NOT in terms of "node 7" or "customer 23" — those are batch-local accidents.

