implement_system: |-
  You are writing heuristic modules for the 2D symmetric Euclidean Travelling Salesman Problem (TSP)
  with ${problem_size} cities.

  Your task is to write a Python module containing exactly one function:
    heuristic(locs, current_node, mask, visited, step_norm, first_node) -> torch.Tensor [B, N]

  ${context}

  Rules:
  - Imports allowed: torch, torch.nn.functional as F, math. Nothing else.
  - All tensor operations must be batched (first dimension is batch size B).
  - N = ${problem_size} (number of cities). Coordinates are in [0,1]^2.
  - No file I/O, network access, environment access, printing, or side effects.
  - Do not modify input tensors in-place.
  - Hard constraint: NO Python `for` loops over batch (`for b in range(B)`) or
    nodes (`for i in range(N)`). NO `while` loops. NO permutation enumeration
    (`itertools.permutations`). All ops must be batched torch ops.
  - No PARAMS dict required. Embed constants directly in code.

  Return a torch.Tensor of shape [B, N] with finite scores for every node.
  Return ONLY the complete Python module, no explanation, no markdown fences.

implement_user: |-
  Implement the following heuristic strategy as a Python module.

  Strategy: ${strategy}

  Use this structure:
  ${template}

template: |-
  import math
  import torch
  import torch.nn.functional as F

  def heuristic(locs, current_node, mask, visited, step_norm, first_node):
      """
      Euclidean TSP next-node scoring heuristic.
      Args:
          locs:         [B, N, 2]  city coordinates (normalised to [0,1]^2)
          current_node: [B]        index of the city just visited
          mask:         [B, N]     True = city not yet visited (feasible)
          visited:      [B, N]     1.0 = already visited
          step_norm:    [B]        fraction of tour completed, in [0,1]
          first_node:   [B]        index of the tour's starting city
      Returns:
          logits: [B, N]  finite raw scores
      """
      B, N, _ = locs.shape
      cur_loc   = locs[torch.arange(B, device=locs.device), current_node]
      start_loc = locs[torch.arange(B, device=locs.device), first_node]
      dist_to_cur   = torch.norm(locs - cur_loc.unsqueeze(1),   dim=-1)
      dist_to_start = torch.norm(locs - start_loc.unsqueeze(1), dim=-1)
      gate   = torch.sigmoid(10.0 * (step_norm - 0.7)).unsqueeze(-1)
      logits = (1 - gate) * (-dist_to_cur) + gate * (-dist_to_start)
      return logits

fallback: |-
  import torch

  def heuristic(locs, current_node, mask, visited, step_norm, first_node):
      B, N, _ = locs.shape
      cur_loc = locs[torch.arange(B, device=locs.device), current_node]
      return -torch.norm(locs - cur_loc.unsqueeze(1), dim=-1)

