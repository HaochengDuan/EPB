template: |
  import torch
  import torch.nn.functional as F
  import math


  def heuristic(unselected_locs, unselected_demand, current_loc, depot_loc,
                load, feasibility_mask):
      """Score each unvisited customer (K logits) AND the depot decision (1 logit).

      Args:
          unselected_locs:    torch.Tensor [B, K, 2]
          unselected_demand:  torch.Tensor [B, K]
          current_loc:        torch.Tensor [B, 2]
          depot_loc:          torch.Tensor [B, 2]
          load:               torch.Tensor [B]   remaining capacity, in [0, 1]
          feasibility_mask:   torch.Tensor [B, K] bool  (True = demand ≤ load)

      Returns:
          torch.Tensor [B, K+1] of logits.  Higher = preferred.
          - positions [0..K-1]: per-customer logits.  Infeasible MUST be float("-inf").
          - position K (last):  depot logit.  Boost it when the vehicle should refill
                                (e.g. low load with no good fit, arm exhausted, etc.).

      K is variable across batches; never hard-code it.
      """
      raise NotImplementedError

fallback: |
  import torch
  import torch.nn.functional as F
  import math


  def heuristic(unselected_locs, unselected_demand, current_loc, depot_loc,
                load, feasibility_mask):
      # Nearest-feasible-customer fallback with a load-modulated depot vote.
      d = ((unselected_locs - current_loc.unsqueeze(1)) ** 2).sum(-1).sqrt()
      cust = (-10.0 * d).masked_fill(~feasibility_mask, float("-inf"))
      # Depot vote: low when load is high (still want to deliver), high when load is low.
      depot = (-10.0 * load + 5.0).unsqueeze(-1)             # [B, 1]
      return torch.cat([cust, depot], dim=-1)                # [B, K+1]

