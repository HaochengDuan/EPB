  - Address the most common and severe failure patterns across all gradients
  - Momentum gradients indicate persistent failure modes — treat them as high priority
  - **Sharpen the winning gap.** If the existing code outputs scores that are too close
    together at the top, increase the multiplier on the dominant signal so the winner
    pulls ahead more decisively after softmax.
  - Keep the function signature unchanged.
