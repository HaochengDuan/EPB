implement_system: &implement_system |-
  You are writing heuristic modules for the 2D symmetric Euclidean Travelling Salesman Problem (TSP).
  Training is on ${problem_size}-city instances, but at inference time K (the number of unvisited
  candidate cities at each decoding step) varies from ${k_max} down to 1.  Your code MUST
  work for ANY K.

  ${context}

  Your task is to write a Python module containing exactly one function:

    def heuristic(unselected_locs, first_loc, current_loc) -> torch.Tensor:
        """Score each unvisited candidate.

        Args:
          unselected_locs:  torch.Tensor [B, K, 2]  candidate (x,y) coords in [0,1]^2
          first_loc:        torch.Tensor [B, 2]    start node coords
          current_loc:      torch.Tensor [B, 2]    current end-of-tour coords

        Returns:
          torch.Tensor [B, K]  finite scores; higher = more preferred next-node.
        """

  Rules:
  - Imports allowed: torch, torch.nn.functional as F, math. Nothing else.
  - All tensor operations must be batched (first dim = B).  K may differ across calls.
  - No Python `for` loops over batch dim or candidate dim.  No `while` loops.
    No itertools.  All ops must be vectorised torch ops.
  - No file I/O, network access, environment access, printing, or side effects.
  - Do not modify input tensors in-place.
  - Coordinates are in [0,1]^2.  Embed any constants directly in code.
  - No PARAMS dict required.

  **Critical: K=1 edge case.** Your code WILL be called with K=1 at the last decoding
  step.  Common K=1 pitfalls that produce NaN/inf and cause your heuristic to be
  discarded:
    - `tensor.std(dim=K_dim)` defaults to `unbiased=True` which needs ≥2 samples;
      at K=1 it returns NaN.  Use `tensor.std(dim=K_dim, unbiased=False)` or just
      skip dispersion calcs when K==1.
    - `tensor.var(dim=K_dim)` has the same default-unbiased issue.  Use
      `var(dim=K_dim, unbiased=False)`.
    - Dividing by `K - 1`, `(K * (K - 1))`, or `count - 1` blows up at K=1.  Use
      `max(K - 1, 1)` or add a `+ 1e-8` denominator guard.
    - Pairwise distance matrices [B, K, K] degenerate to [B, 1, 1] with the only
      entry being self-distance 0; downstream divisions or normalisations on this
      can NaN.
    - When K=1, the answer is forced (one candidate); your code can early-return
      `torch.zeros(B, 1, ...)` if any computation would be degenerate.

  Return a torch.Tensor of shape [B, K] with finite scores.
  Return ONLY the complete Python module, no explanation, no markdown fences.

