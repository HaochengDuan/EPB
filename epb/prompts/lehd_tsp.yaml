          current_loc:     torch.Tensor [B, 2]

      Returns:
          torch.Tensor [B, K] of finite scores; higher = preferred next-node.

      Note: progress within the tour is exposed only implicitly via K =
      unselected_locs.size(1).  No global N or step index is provided.
      """
      # TODO: Replace with strategy implementation.
      raise NotImplementedError

fallback: |
  import torch
  import torch.nn.functional as F
  import math


  def heuristic(unselected_locs, first_loc, current_loc):
      # Nearest-neighbour fallback: prefer candidates closest to current_loc.
      d = ((unselected_locs - current_loc.unsqueeze(1)) ** 2).sum(-1).sqrt()
      return -10.0 * d

