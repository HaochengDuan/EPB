context: |-
  **Subgraph decoder formulation (${formulation}).**
  At each decoding step the heuristic receives ONLY the unvisited subgraph
  plus the start (first_loc) and current end (current_loc) of the partial tour.
  Visited nodes are NOT shown — the input subgraph IS the remaining problem.
  The output is a score over the K candidate next-nodes, where K shrinks across
  the rollout from N-1 down to 1.  Your code MUST work for ANY K.

  Progress within the tour is implicit: it is exposed ONLY through K
  (= unselected_locs.size(1)).  No global N, step index, or step_norm is provided
  — this matches what the ${teacher} teacher itself sees.  If your strategy needs a
  "how-far-along" signal, derive it from the geometry of unselected_locs (e.g.
  spread, mean distance to first_loc) or from K itself, and AVOID hard-coded
  thresholds tied to a particular N.

  **Critical: the teacher distribution is near one-hot.**
  The teacher policy is a near-deterministic ${teacher} model:
    - top-1 candidate receives ~95% probability
    - top-2 candidate receives ~4.5% probability
    - the remaining K-2 candidates share less than 0.5% combined

  Two implications for heuristic design:

  1. **Output sharp, decisive scores.** The winning candidate's score should be
     substantially higher than the runner-up. After softmax with the training
     temperature, your output should look near-one-hot in clear-cut situations
     — not a smoothly graded distribution. A decisive winner gap matters more
     than carefully shaping the long tail.

  2. **Top-1 is what matters; top-2 is a soft backup; the rest is irrelevant.**
     Don't waste complexity on shaping the bottom of the distribution. A simple
     "score = -distance + lookahead_bonus" can outperform an 8-signal weighted
     mixture if the simpler one consistently picks the right top-1.

  Heuristics are evaluated on:
    (a) whether their argmax matches the teacher's argmax  (primary)
    (b) whether their top-2 contains the teacher's argmax  (secondary)
  The full distribution shape does not matter. Avoid over-engineering for it.

idea_system: |-
  You are an expert in the 2D symmetric Euclidean Travelling Salesman Problem.
  Training is on ${problem_size}-city instances, but the heuristic must generalise to any
  subgraph size K ∈ [${k_min}, ${k_max}] because it is called repeatedly during decoding
  on a shrinking unvisited set.

  ${context}

  Describe ONE strategy for choosing the next city at each decoding step (1-3 sentences).
  Focus on a strategy that produces a CLEAR top-1 winner from the candidates, not one
  that ranks many of them similarly. Top-1 hit rate is the primary metric.

  The strategy must rely only on (unselected_locs, first_loc, current_loc).
  There is NO global "visited mask" or full-instance node list available — visited nodes
  are not in the input.  Progress within the tour is exposed ONLY via K =
  unselected_locs.size(1).  No step index or step_norm is provided.

  Diversity guideline:
  Avoid proposing a strategy that is functionally identical to an existing one.
  - You may reuse existing features as secondary signals, as long as the overall
    combination or decision logic is meaningfully new.
  - Simpler strategies with one or two strong signals are preferred over complex
    multi-signal blends.

  Use only TSP reasoning; do not mention VRP concepts.
  Do NOT write code or mathematical formulas.

