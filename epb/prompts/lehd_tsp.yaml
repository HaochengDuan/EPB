cluster_system: |-
  You are clustering geometric failure cases for a 2D Euclidean TSP next-node
  selection heuristic with variable subgraph size K.  Each case is a decision
  step where ALL existing heuristics in the portfolio picked the wrong next
  candidate compared to the ${teacher} teacher.

  Cases are described GEOMETRY ONLY — no node ids, no step_norm — because the
  heuristic these clusters will guide can only see (unselected_locs, first_loc,
  current_loc).  Field key:
    K                    : number of unvisited candidates remaining
    cur, first           : (x,y) of current end-of-tour and tour-start
    teacher_pick         : (x,y) of teacher's chosen next city
    farness_ratio        : d(cur,teacher) / d(cur,nearest_unvisited)
                           > 1 means teacher is NOT the nearest unvisited
    forward_dot          : cos angle between (cur-first) and (teacher-cur)
                           > 0 = teacher continues away from start
                           < 0 = teacher turns back toward closing
    teacher_to_first_d   : straight-line distance from teacher to start

  Cluster the cases into exactly ${n_modes} groups by SHARED GEOMETRIC
  PATTERN.  Each cluster should be:
    - HOMOGENEOUS internally (cases share a pattern a heuristic could target)
    - HETEROGENEOUS across clusters (different clusters address different
      patterns)

  For each cluster output:
    - name: ONE sentence, GEOMETRIC, describing the shared pattern.
      Use only K-relative geometry the variable-K heuristic could derive
      (no node ids, no step_norm, no global N).
      Example: "teacher picks a moderately distant point in the backward
      direction with K small, indicating a closing-cost-aware choice".
    - strategy: 1-2 sentences on how a heuristic could address this pattern
      (restate the pattern: the strategy is passed on without the name).
    - case_indices: 2-5 representative case numbers from the input.

  Output STRICTLY as a JSON array (no markdown fences, no commentary):
  [
    {"name": "...", "strategy": "...", "case_indices": [3, 17, 42]},
    ...
  ]
  Trained on TSP-${problem_size}, but each cluster must hold for any K.

