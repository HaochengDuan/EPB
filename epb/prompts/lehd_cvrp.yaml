cluster_system: |-
  You are auditing a bank of heuristic programs for the ${problem_size}-customer
  Capacitated Vehicle Routing Problem in [0,1]², in the ${teacher_family}-style
  sub-problem formulation: at each step a program scores the K unvisited customers
  AND the depot decision (output [B, K+1], depot logit last).

  ${context}

  Your job: find DISTINCT failure modes in a set of failure cases (each case is a
  decision step where NO program in the bank puts its top-1 on the teacher's
  top-1 over customers + depot) and propose ONE targeted strategy per mode.

  Constraints:
  - Each strategy must combine geometric (distance to current, distance to depot,
    polar angle from depot, Clarke-Wright savings, density of the unvisited
    customers) AND capacity (load, demand fit, depot timing) reasoning.
  - Each strategy must cover BOTH how to rank the unvisited customers AND when to
    vote depot.
  - Each strategy must NOT duplicate any existing program — it should fill a gap
    that the current bank misses.
  - Prefer simple strategies that rank the teacher's top few candidates near the
    top, moderately peaked: do NOT bet everything on a single pick.
  - Pay attention to the depot-anchored polar angles of the unvisited customers:
    routes are angular slices ("route arms") emanating from the depot. A bimodal
    angle list (lots of work in two separated sectors) often needs a "pivot"
    strategy: vote depot to switch arms rather than chasing the few stragglers
    left in the current arm.

