# POMO teacher, TSP-100. The teacher checkpoint (yd-kwon/POMO format) is not part of this package.
setting: {name: pomo_tsp}
run: {output_dir: runs/pomo_tsp100, seed: 42}
data: {path: data/pomo_tsp100_steps.pt}
generate: {teacher_ckpt: <POMO_TSP100_CKPT>, problem_size: 100, num_instances: 100000}
llm: {model: deepseek-v4-pro, reasoning_effort: none, max_workers: 16, max_cost_usd: 40, price_input: 0.66, price_output: 1.98, price_cache_read: 0.022}
